[project]
name = "instacart-market-basket-portfolio"
version = "0.1.0"
description = "Projeto de portfolio com ingestao simulada, ETL, features, modelos e dashboard para Instacart Market Basket Analysis."
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

